<script>
const phases=[
  {
    title:"Folder structure",
    tags:["new"],
    summary:"The Trade panel is more complex than News Feed — it has both a form side (buy/sell inputs) and a live status side (order tracking via WebSocket). Keep them cleanly separated from the start.",
    sections:[
      {label:null,code:
`app/
└── trade/
    └── [ticker]/
        └── page.tsx          ← Route: /trade/AAPL

components/
└── trade/
    ├── TradePanel.tsx         ← Shell: tabs Buy/Sell, mounts the form
    ├── OrderForm.tsx          ← Controlled form, calls usePlaceOrder
    ├── OrderConfirmModal.tsx  ← Review step before submitting
    ├── OrderStatusFeed.tsx    ← Live WS updates after submission
    ├── PriceSummary.tsx       ← Current price, est. total (read-only)
    └── TradeSkeleton.tsx      ← Loading state

hooks/
├── usePlaceOrder.ts           ← useMutation — POST the order
├── useOrderStatus.ts          ← WebSocket — listens for status updates
└── useCurrentPrice.ts         ← TanStack Query — current bid/ask price

lib/api/
└── orders.ts                  ← Raw fetch: placeOrder()

store/
└── orderStore.ts              ← Zustand: pending orders, status map

types/
└── order.ts                   ← Order, OrderStatus, OrderSide interfaces`}
    ],
    concept:"Strict rule: usePlaceOrder handles submission. useOrderStatus handles live tracking. They are intentionally separate — submission is a one-shot mutation, tracking is an ongoing stream. Mixing them in one hook makes both harder to reason about.",
  },
  {
    title:"Type definitions",
    tags:["new"],
    summary:"Define every shape before writing logic. The order lifecycle has distinct states — model them explicitly so TypeScript enforces valid transitions.",
    sections:[
      {label:"types/order.ts",file:true,code:
`export type OrderSide = "buy" | "sell"
export type OrderType = "market" | "limit"

export type OrderStatus =
  | "idle"        // not submitted yet
  | "pending"     // submitted, awaiting exchange ack
  | "partial"     // partially filled
  | "filled"      // fully executed
  | "cancelled"   // cancelled before fill
  | "rejected"    // rejected by exchange

export interface OrderFormValues {
  ticker: string
  side: OrderSide
  type: OrderType
  quantity: number
  limitPrice?: number   // only when type === "limit"
}

export interface PlacedOrder {
  orderId: string
  ticker: string
  side: OrderSide
  type: OrderType
  quantity: number
  limitPrice?: number
  placedAt: string      // ISO 8601
  status: OrderStatus
}

export interface OrderStatusEvent {
  orderId: string
  status: OrderStatus
  filledQuantity: number
  averagePrice?: number
  updatedAt: string
}`}
    ],
    concept:"OrderStatus as a union type is key. It means TypeScript will error if you write a switch/case that misses a state — you can never accidentally ignore 'rejected' or 'partial'. This prevents silent UI bugs where a status shows 'pending' forever.",
  },
  {
    title:"API layer",
    tags:["new"],
    summary:"One plain async function. No hooks, no React. Just the POST call that submits the order to the backend.",
    sections:[
      {label:"lib/api/orders.ts",file:true,code:
`import type { OrderFormValues, PlacedOrder } from "@/types/order"

export async function placeOrder(
  values: OrderFormValues
): Promise<PlacedOrder> {
  const res = await fetch("/api/orders", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(values),
  })

  if (!res.ok) {
    // Parse the error body so useMutation's error state
    // contains the exchange's rejection reason
    const body = await res.json().catch(() => ({}))
    throw new Error(body.message ?? "Order failed")
  }

  return res.json()
}`}
    ],
    warn:"Never swallow errors here. Throw them — useMutation catches thrown errors and exposes them via mutation.error. If you catch-and-return null, the mutation thinks it succeeded and the UI shows a success toast for a failed order.",
  },
  {
    title:"usePlaceOrder — useMutation",
    tags:["tsq","new"],
    summary:"This is the flip side of useQuery. useMutation handles one-shot write operations: submitting the order, tracking its loading/error/success state, and triggering side effects on completion.",
    sections:[
      {label:"hooks/usePlaceOrder.ts",file:true,code:
`import { useMutation, useQueryClient } from "@tanstack/react-query"
import { placeOrder } from "@/lib/api/orders"
import { useOrderStore } from "@/store/orderStore"
import type { OrderFormValues } from "@/types/order"

export function usePlaceOrder() {
  const queryClient = useQueryClient()
  const addPendingOrder = useOrderStore((s) => s.addPendingOrder)

  return useMutation({
    mutationFn: (values: OrderFormValues) => placeOrder(values),

    onSuccess: (placedOrder) => {
      // 1. Add to Zustand so OrderStatusFeed can track it
      addPendingOrder(placedOrder)

      // 2. Invalidate portfolio — holdings changed after a fill
      queryClient.invalidateQueries({ queryKey: ["portfolio"] })

      // 3. Invalidate buying power — cash changed
      queryClient.invalidateQueries({ queryKey: ["account", "buyingPower"] })
    },

    onError: (error) => {
      // Error is exposed via mutation.error — handle display in the component
      console.error("Order rejected:", error.message)
    },
  })
}`},
      {label:"What you get back",code:
`const mutation = usePlaceOrder()

mutation.mutate(formValues)       // submit the order

mutation.isPending                // true while POST is in flight
mutation.isSuccess                // true after onSuccess fires
mutation.isError                  // true if the POST threw
mutation.error?.message           // exchange rejection reason
mutation.data                     // the PlacedOrder returned on success
mutation.reset()                  // clear back to idle state`}
    ],
    concept:"queryClient.invalidateQueries() in onSuccess is the key pattern. It tells TanStack Query 'this data is now stale — refetch it'. The portfolio component re-renders with fresh holdings automatically, without any prop drilling or manual state update.",
  },
  {
    title:"Zustand order store",
    tags:["zus","new"],
    summary:"Tracks the state of all in-flight and recently filled orders. This is what bridges the mutation (submission) and the WebSocket (live status) — both read and write to this same store.",
    sections:[
      {label:"store/orderStore.ts",file:true,code:
`import { create } from "zustand"
import type { PlacedOrder, OrderStatus } from "@/types/order"

interface OrderState {
  // Map of orderId → PlacedOrder for all active orders
  orders: Record<string, PlacedOrder>

  addPendingOrder: (order: PlacedOrder) => void

  // Called by useOrderStatus when a WS event arrives
  updateOrderStatus: (
    orderId: string,
    status: OrderStatus,
    filledQuantity: number,
    averagePrice?: number
  ) => void

  clearFilledOrders: () => void
}

export const useOrderStore = create<OrderState>((set) => ({
  orders: {},

  addPendingOrder: (order) =>
    set((s) => ({
      orders: { ...s.orders, [order.orderId]: order },
    })),

  updateOrderStatus: (orderId, status, filledQuantity, averagePrice) =>
    set((s) => {
      if (!s.orders[orderId]) return s
      return {
        orders: {
          ...s.orders,
          [orderId]: {
            ...s.orders[orderId],
            status,
            filledQuantity,
            averagePrice,
          },
        },
      }
    }),

  clearFilledOrders: () =>
    set((s) => ({
      orders: Object.fromEntries(
        Object.entries(s.orders).filter(
          ([, o]) => o.status !== "filled" && o.status !== "cancelled"
        )
      ),
    })),
}))`}
    ],
    concept:"The store is the single source of truth for order state. usePlaceOrder writes to it (addPendingOrder). useOrderStatus writes to it (updateOrderStatus). OrderStatusFeed reads from it. Nothing needs to pass data via props — any component can subscribe to any order.",
  },
  {
    title:"useOrderStatus — WebSocket",
    tags:["ws","new"],
    summary:"Opens a WebSocket after an order is placed and listens for status events from the exchange. Each event updates Zustand — all components subscribed to that order re-render automatically.",
    sections:[
      {label:"hooks/useOrderStatus.ts",file:true,code:
`import { useEffect, useRef } from "react"
import { useOrderStore } from "@/store/orderStore"
import { useQueryClient } from "@tanstack/react-query"
import type { OrderStatusEvent } from "@/types/order"

const TERMINAL_STATUSES = new Set(["filled", "cancelled", "rejected"])

export function useOrderStatus(orderId: string | null) {
  const updateOrderStatus = useOrderStore((s) => s.updateOrderStatus)
  const queryClient = useQueryClient()
  const wsRef = useRef<WebSocket | null>(null)

  useEffect(() => {
    // No orderId yet (before submission) — do nothing
    if (!orderId) return

    const ws = new WebSocket(
      \`\${process.env.NEXT_PUBLIC_WS_URL}/orders/\${orderId}/status\`
    )
    wsRef.current = ws

    ws.onmessage = (event) => {
      const msg: OrderStatusEvent = JSON.parse(event.data)

      // 1. Update Zustand — triggers re-render in OrderStatusFeed
      updateOrderStatus(
        msg.orderId,
        msg.status,
        msg.filledQuantity,
        msg.averagePrice
      )

      // 2. On fill: invalidate portfolio so holdings refresh
      if (msg.status === "filled") {
        queryClient.invalidateQueries({ queryKey: ["portfolio"] })
        ws.close()   // terminal state — no more events expected
      }

      // 3. On terminal status: close the socket
      if (TERMINAL_STATUSES.has(msg.status)) {
        ws.close()
      }
    }

    ws.onerror = () => {
      // Fallback: poll order status if WS fails
      console.warn(\`WS failed for order \${orderId}, consider polling fallback\`)
    }

    // Cleanup: always close on unmount or orderId change
    return () => ws.close()

  }, [orderId])  // reconnects only when orderId changes
}`}
    ],
    concept:"Closing the WebSocket on terminal status (filled, cancelled, rejected) is critical. If you leave it open, the server keeps pushing to a connection nobody needs. More importantly: the cleanup function (return () => ws.close()) prevents stale connections when the component unmounts — e.g. when the user navigates away mid-order.",
    danger:"Missing the cleanup return is the most common WebSocket bug. Without it, every re-render of the parent creates a new WebSocket. After 10 navigations you have 10 open connections all writing to the same Zustand store — you'll see duplicate status updates and confusing state.",
  },
  {
    title:"OrderForm component",
    tags:["new"],
    summary:"The controlled form component. Manages local form state, shows a confirmation modal before submitting, then hands off to usePlaceOrder. Deliberately keeps no knowledge of WebSocket or order tracking.",
    sections:[
      {label:"components/trade/OrderForm.tsx",file:true,code:
`"use client"

import { useState } from "react"
import { usePlaceOrder } from "@/hooks/usePlaceOrder"
import { useOrderStore } from "@/store/orderStore"
import type { OrderFormValues, OrderSide, OrderType } from "@/types/order"

interface Props { ticker: string; side: OrderSide }

export function OrderForm({ ticker, side }: Props) {
  const mutation = usePlaceOrder()

  // Local form state — doesn't touch Zustand until submission
  const [orderType, setOrderType] = useState<OrderType>("market")
  const [quantity, setQuantity]   = useState("")
  const [limitPrice, setLimitPrice] = useState("")
  const [showConfirm, setShowConfirm] = useState(false)

  const formValues: OrderFormValues = {
    ticker,
    side,
    type: orderType,
    quantity: Number(quantity),
    limitPrice: orderType === "limit" ? Number(limitPrice) : undefined,
  }

  const isValid =
    Number(quantity) > 0 &&
    (orderType === "market" || Number(limitPrice) > 0)

  const handleSubmit = () => {
    setShowConfirm(false)
    mutation.mutate(formValues, {
      onSuccess: () => {
        // Reset form after successful submission
        setQuantity("")
        setLimitPrice("")
      }
    })
  }

  // After success — switch to showing the order status
  if (mutation.isSuccess && mutation.data) {
    return <OrderStatusFeed orderId={mutation.data.orderId} />
  }

  return (
    <div>
      {/* Order type toggle: Market / Limit */}
      {/* Quantity input */}
      {/* Limit price input — only shown when type === "limit" */}
      {/* Estimated total (quantity × current price) */}

      {mutation.isError && (
        <p role="alert" style={{ color: "red" }}>
          {mutation.error?.message ?? "Order failed. Try again."}
        </p>
      )}

      <button
        onClick={() => setShowConfirm(true)}
        disabled={!isValid || mutation.isPending}
      >
        {mutation.isPending
          ? "Placing order..."
          : \`\${side === "buy" ? "Buy" : "Sell"} \${ticker}\`}
      </button>

      {showConfirm && (
        <OrderConfirmModal
          values={formValues}
          onConfirm={handleSubmit}
          onCancel={() => setShowConfirm(false)}
        />
      )}
    </div>
  )
}`}
    ],
    concept:"mutation.isSuccess check after the return guard is the key UX pattern. Once the order is placed successfully, the same panel transitions from the form view to the live status feed — no route change, no modal dismiss. The user stays in context and watches their order fill in real time.",
  },
  {
    title:"OrderStatusFeed component",
    tags:["ws","zus","new"],
    summary:"Rendered after a successful submission. Opens the WebSocket via useOrderStatus and reads live state from Zustand. Displays a progress timeline as the order moves through states.",
    sections:[
      {label:"components/trade/OrderStatusFeed.tsx",file:true,code:
`"use client"

import { useOrderStatus } from "@/hooks/useOrderStatus"
import { useOrderStore } from "@/store/orderStore"

interface Props { orderId: string }

const STATUS_STEPS = ["pending", "partial", "filled"] as const

export function OrderStatusFeed({ orderId }: Props) {
  // Open the WebSocket — updates Zustand on each event
  useOrderStatus(orderId)

  // Read current state from Zustand
  const order = useOrderStore((s) => s.orders[orderId])

  if (!order) return null

  const isFinal =
    order.status === "filled" ||
    order.status === "cancelled" ||
    order.status === "rejected"

  return (
    <div>
      {/* Status timeline */}
      <ol>
        {STATUS_STEPS.map((step) => (
          <li
            key={step}
            data-active={order.status === step}
            data-done={
              STATUS_STEPS.indexOf(step) <
              STATUS_STEPS.indexOf(order.status as typeof STATUS_STEPS[number])
            }
          >
            {step}
          </li>
        ))}
      </ol>

      {/* Fill details */}
      {order.status === "partial" && (
        <p>{order.filledQuantity} of {order.quantity} shares filled</p>
      )}

      {order.status === "filled" && (
        <p>
          Filled {order.quantity} shares
          at avg. ₩{order.averagePrice?.toLocaleString()}
        </p>
      )}

      {order.status === "rejected" && (
        <p role="alert">Order rejected by exchange.</p>
      )}

      {/* Back to form if terminal */}
      {isFinal && (
        <button onClick={() => window.location.reload()}>
          Place another order
        </button>
      )}
    </div>

let cur=0;

function nav(d){cur=Math.max(0,Math.min(phases.length-1,cur+d));render()}
function goTo(i){cur=i;render()}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function render(){
  const p=phases[cur];
  const tagMap={tsq:['t-tsq','TanStack Query'],zus:['t-zus','Zustand'],ws:['t-ws','WebSocket'],new:['t-new','New file']};

  document.getElementById('stepper').innerHTML=phases.map((_,i)=>{
    const cls=i<cur?'pill done':i===cur?'pill active':'pill';
    return `<span class="${cls}" onclick="goTo(${i})">${i<cur?'✓':i+1}</span>${i<phases.length-1?'<div class="sep"></div>':''}`;
  }).join('');

  const tagsHtml=p.tags.map(t=>{const[cls,lbl]=tagMap[t];return`<span class="tag ${cls}">${lbl}</span>`}).join('');

  const sectionsHtml=p.sections.map(s=>{
    const fl=s.file?`<div class="file-label"><i class="ti ti-file-code" aria-hidden="true"></i>${s.label}</div>`:s.label?`<div class="sec-title">${s.label}</div>`:'';
    return`${fl}<pre>${esc(s.code)}</pre>`;
  }).join('');

  const extras=[
    p.concept?`<div class="concept"><strong>Key concept:</strong> ${p.concept}</div>`:'',
    p.warn?`<div class="warn"><strong>Note:</strong> ${p.warn}</div>`:'',
    p.danger?`<div class="danger"><i class="ti ti-alert-triangle" aria-hidden="true"></i> <strong>Common bug:</strong> ${p.danger}</div>`:'',
  ].join('');

  document.getElementById('card').innerHTML=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap">
      <div>
        <div style="font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px">Phase ${cur+1} of ${phases.length}</div>
        <h2>${p.title}</h2>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${tagsHtml}</div>
    </div>
    <p class="body">${p.summary}</p>
    ${sectionsHtml}${extras}`;

  document.getElementById('btn-prev').disabled=cur===0;
  document.getElementById('btn-next').disabled=cur===phases.length-1;
  document.getElementById('btn-next').textContent=cur===phases.length-1?'Done ✓':'Next →';
  document.getElementById('ctr').textContent=`${cur+1} / ${phases.length}`;
}

render();
</script>
